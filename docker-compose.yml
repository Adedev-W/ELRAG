name: elrag

services:
  scylla:
    image: scylladb/scylla:2026.1.3
    container_name: elrag-scylla
    command:
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - "1"
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh $(hostname -i) 9042 -e \"SELECT cluster_name FROM system.local;\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  scylla-init:
    image: scylladb/scylla:2026.1.3
    depends_on:
      scylla:
        condition: service_healthy
    environment:
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-production}
    volumes:
      - ./scripts/init-scylla.sh:/init-scylla.sh:ro
    entrypoint:
      - bash
      - /init-scylla.sh

  redis:
    image: redis:7.4-alpine
    container_name: elrag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scylla-data:
  redis-data:
